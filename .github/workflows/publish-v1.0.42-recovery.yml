name: Publish v1.0.42 recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.0.42-recovery.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-29e4-820e-b7ef-9322c4d1acbf/raw?se=2026-10-31T23%3A15%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=15761c1d-eebe-58d3-8157-be44b1359c75&skoid=9fcafdab-1a9a-48a1-833e-6f0dce81fc66&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-31T11%3A43%3A25Z&ske=2026-11-01T11%3A43%3A25Z&sks=b&skv=2026-02-06&sig=APwjcs6NZiKAdXBLFaZIAHeAcxUjnC2TQ6Z4pvMEfOk%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o artifact.zip
          unzip -q artifact.zip
          test -f ContrachequeIA-v1.0.42.apk
          echo "a70ff3d5ef91c91c67268053f45c51ab653cc44cebeb7f80813295ce5dbe54db  ContrachequeIA-v1.0.42.apk" | sha256sum -c -

      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="achouofertasoficial-commits/contracheque-ia-releases"
          if gh release view v1.0.42 --repo "$REPO" >/dev/null 2>&1; then
            gh release upload v1.0.42 ContrachequeIA-v1.0.42.apk --repo "$REPO" --clobber
          else
            gh release create v1.0.42 ContrachequeIA-v1.0.42.apk \
              --repo "$REPO" \
              --title "Contracheque IA v1.0.42" \
              --notes "Correção do fluxo de abertura: remove a tela antiga de carregamento e mantém a verificação de atualizações em segundo plano."
          fi
